[project]
name = "chore-tracker"
version = "0.1.0"
description = "A tool for managing shared household chores"
requires-python = ">=3.12"
dependencies = [
    "Django>=5,<6",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-django>=4,<5",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "chore_tracker.settings"
